name: Build and push

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  workflow_dispatch:

env:
  IMAGE: magohl/whoamicore

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set image version
      run: |
        # Tags build versioned images (e.g. v10.0.0); master builds use the commit sha
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          echo "RELEASE_VERSION=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"
        else
          echo "RELEASE_VERSION=sha-${GITHUB_SHA::7}" >> "${GITHUB_ENV}"
        fi

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Build and push
      run: |
        docker build src \
          -t "${{ env.IMAGE }}:${{ env.RELEASE_VERSION }}" \
          -t "${{ env.IMAGE }}:latest"
        docker push "${{ env.IMAGE }}:${{ env.RELEASE_VERSION }}"
        docker push "${{ env.IMAGE }}:latest"

    - name: Run image smoke test
      run: |
        docker run -d --name smoke -p 8080:8080 "${{ env.IMAGE }}:${{ env.RELEASE_VERSION }}"
        sleep 5
        curl -sf http://localhost:8080/ | grep -q "Framework: .NET 10" || (docker logs smoke && exit 1)
        docker rm -f smoke
