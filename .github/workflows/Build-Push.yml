name: Build and push

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set image version
      run: |
        # Tags build versioned images (e.g. v10.0.0); master builds use the commit sha
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          echo "RELEASE_VERSION=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"
        else
          echo "RELEASE_VERSION=sha-${GITHUB_SHA::7}" >> "${GITHUB_ENV}"
        fi

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      run: |
        docker build src \
          -t "ghcr.io/${{ github.repository_owner }}/whoamicore:${{ env.RELEASE_VERSION }}" \
          -t "ghcr.io/${{ github.repository_owner }}/whoamicore:latest"
        docker push "ghcr.io/${{ github.repository_owner }}/whoamicore:${{ env.RELEASE_VERSION }}"
        docker push "ghcr.io/${{ github.repository_owner }}/whoamicore:latest"

    - name: Run image smoke test
      run: |
        docker run -d --name smoke -p 8080:8080 "ghcr.io/${{ github.repository_owner }}/whoamicore:${{ env.RELEASE_VERSION }}"
        sleep 5
        curl -sf http://localhost:8080/ | grep -q "Framework: .NET 10" || (docker logs smoke && exit 1)
        docker rm -f smoke
